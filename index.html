<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="AstroTether — Dual-screen physics co-op game for couples & friends. Controlled live using two smartphones."
    />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts for futuristic sci-fi typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Fallback redirect: ensure direct non-hash SPA paths (e.g. /join or /controller) map cleanly to hash routes -->
    <script>
      (function() {
        var pathname = window.location.pathname;
        if (pathname && pathname !== '/' && !pathname.includes('.')) {
          window.location.replace('/#' + pathname + window.location.search + window.location.hash);
        }
      })();
    </script>

    <title>AstroTether</title>
  </head>
  <body class="bg-space-navy text-gray-100 antialiased selection:bg-neon-cyan/30 selection:text-neon-cyan" style="margin:0; background:#0B0F19;">
    <div id="root">
      <div style="position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0B0F19; color:#fff; font-family:system-ui,-apple-system,sans-serif; select-none:none; z-index:9999;">
        <div style="position:relative; width:80px; height:80px; margin-bottom:20px;">
          <svg viewBox="0 0 100 100" style="width:100%; height:100%; animation:astroSpin 3s linear infinite;">
            <circle cx="50" cy="50" r="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
            <circle cx="50" cy="50" r="36" fill="none" stroke="url(#splashGrad)" stroke-width="3" stroke-dasharray="60 160" stroke-linecap="round" />
            <defs>
              <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F0FF" />
                <stop offset="100%" stop-color="#FF2A85" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="14" r="6" fill="#00F0FF" style="filter:drop-shadow(0 0 6px #00F0FF);" />
            <circle cx="50" cy="86" r="6" fill="#FF2A85" style="filter:drop-shadow(0 0 6px #FF2A85);" />
            <line x1="50" y1="14" x2="50" y2="86" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
          </svg>
        </div>
        <div style="font-weight:900; letter-spacing:3px; font-size:16px; background:linear-gradient(90deg, #00F0FF, #fff, #FF2A85); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase;">
          AstroTether
        </div>
        <div style="margin-top:8px; font-size:11px; letter-spacing:1px; color:#94A3B8; font-family:monospace;">
          INITIALIZING COCKPIT...
        </div>
        <style>
          @keyframes astroSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
