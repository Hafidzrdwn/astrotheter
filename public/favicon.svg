<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="tetherGrad" x1="16" y1="18" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>
    <linearGradient id="cyanPodGrad" x1="12" y1="14" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70F8FF" />
      <stop offset="100%" stop-color="#00B8D4" />
    </linearGradient>
    <linearGradient id="pinkPodGrad" x1="40" y1="40" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF65A5" />
      <stop offset="100%" stop-color="#D9005B" />
    </linearGradient>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141D30" />
      <stop offset="100%" stop-color="#070A12" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Space Badge Background -->
  <rect width="64" height="64" rx="16" fill="url(#spaceBg)" />
  <circle cx="32" cy="32" r="30" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Orbit Guides / Cosmic Waves -->
  <path d="M12 32 C12 18, 52 18, 52 32 C52 46, 12 46, 12 32 Z" 
        stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- The Glowing Elastic Tether Loop -->
  <path d="M18 20 C28 10, 48 22, 32 32 C16 42, 36 54, 46 44" 
        stroke="url(#tetherGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Central Energy Core Nexus -->
  <circle cx="32" cy="32" r="3.5" fill="#FFE600" filter="url(#glow)" />
  <path d="M32 26 L33 31 L38 32 L33 33 L32 38 L31 33 L26 32 L31 31 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Alpha Pod (Cyan Ship, Top-Left) -->
  <g transform="translate(18, 20) rotate(45)">
    <!-- Thruster particle -->
    <circle cx="-8" cy="0" r="2" fill="#00F0FF" opacity="0.75" />
    <circle cx="-13" cy="0" r="1.2" fill="#00F0FF" opacity="0.4" />
    <!-- Ship hull -->
    <path d="M7 0 L-6 -6 L-3 0 L-6 6 Z" fill="url(#cyanPodGrad)" stroke="#00F0FF" stroke-width="1" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Beta Pod (Pink Ship, Bottom-Right) -->
  <g transform="translate(46, 44) rotate(-135)">
    <!-- Thruster particle -->
    <circle cx="-8" cy="0" r="2" fill="#FF2A85" opacity="0.75" />
    <circle cx="-13" cy="0" r="1.2" fill="#FF2A85" opacity="0.4" />
    <!-- Ship hull -->
    <path d="M7 0 L-6 -6 L-3 0 L-6 6 Z" fill="url(#pinkPodGrad)" stroke="#FF2A85" stroke-width="1" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>
</svg>